<footer class="foot">
  <div class="u-container foot__inner">
    <div class="foot__brand">
      <span class="foot__kanji" aria-hidden="true">結</span>
      <p class="foot__note">{{ i18n.content().footer.note }}</p>
    </div>

    <p class="foot__meta">
      © {{ year }} {{ i18n.profile.name }} — {{ i18n.content().footer.rights }}
    </p>

    <a class="foot__top link-underline" href="#inicio">{{ i18n.content().footer.toTop }} ↑</a>
  </div>
</footer>
